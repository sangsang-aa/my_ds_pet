# pet.ini 配置样例（可选）

这个演示程序的**全部参数都有默认值**（见 `src/core/config.h`），不放 `pet.ini` 也能正常跑。
想调参时，把本文件复制为 `desktop_pet_image/pet.ini` 再修改；文件必须和 `pet_demo.exe`
同级的 `desktop_pet_image/` 目录里。

## 解析规则（先读，避免踩坑）

- `#` / `;` 注释**必须单独成行**，不支持行尾注释：
  `idle_min_ticks = 5 ; 注释` 会导致整段解析失败、回退默认值 30。
- `[section]` 分区；`key = value`；重复键最后一个生效。
- 值必须整段可解析为数字，否则该项回退默认；**没有范围校验**，负值/0 会异常。
- 改动在启动时生效；`scale_factor` 影响帧加载，改后必须重启。

## 全局参数

```ini
[pet]
idle_min_ticks = 30          # 待机停留下限（tick，1 tick ≈ 100 ms）
idle_max_ticks = 100         # 待机停留上限；约 3~10 秒后自动选方向移动
wait_min_ticks = 1200        # 拖拽松手后的等待下限（约 2 分钟）
wait_max_ticks = 1800        # 等待上限（约 3 分钟）
head_band_percent = 45       # 头部带上界百分比；实际底边还要减 20% 内缩 → 默认 0~25%
head_band_top_percent = 0    # 头部带顶部跳过比例
sweep_threshold_px = 50      # 一次有效扫头换向的最小水平位移
max_sweep_delta_px = 80      # 单次鼠标移动允许的最大跳变，过滤重入
scale_factor = 0.70          # 帧缩放；384×512 → 269×358，改后重启

[bubble]
emoji_size_px = 220          # emoji 最长边缩放尺寸，也决定气泡主体大小
pad_px = 10                  # emoji 与气泡边缘间距
radius_px = 10               # 圆角半径
tail_w = 18                  #尾巴基部宽度
tail_h = 12                  # 尾巴高度；气泡默认 252×252
gap_px = 4                   # 尾巴尖与宠物主体间隙
min_ticks = 200              # 两次气泡最小间隔（约 20 秒）
max_ticks = 600              # 最大间隔（约 60 秒）
show_ticks = 30              # 每次显示时长（约 3 秒）
```

## 按行为覆盖（可选）

section 名 = `desktop_pet_image/` 下的动作目录名。可覆盖 `min_ticks` / `max_ticks` /
`weight` / `dx` / `dy`；**不能**覆盖 `trigger` / `playback` / `gatedByWait`。

```ini
[walking_up]
min_ticks = 52
max_ticks = 52
weight = 1
dy = -5

[walking_left]
dx = -5
```

> 注意：`min_ticks` 对 Auto 行为同时是「持续时间下限」和「启动冷却」，
> 不是「待机停留」；待机停留由上面 `[pet] idle_min/max_ticks` 控制。

完整键表、默认值、加载顺序与失败模式见
[`docs/architecture/04-assets-and-config.md`](../docs/architecture/04-assets-and-config.md)。
